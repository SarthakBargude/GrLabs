name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q -o gba-android.zip
          echo "DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK, NDK, CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK (arm64)
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug -PabiFilters=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gba-emulator-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
